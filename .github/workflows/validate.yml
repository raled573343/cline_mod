name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -euo pipefail
          for f in anchors/*.json anchors/reports/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
            echo "JSON OK $f"
          done

      - name: Syntax-check the anchor tool
        run: node --check tools/cline-limits-tool.mjs

      - name: Tool usage smoke test
        run: |
          set -euo pipefail
          node tools/cline-limits-tool.mjs render-docs
          node tools/cline-limits-tool.mjs notes --version "$(node -e "console.log(Object.keys(require('./anchors/anchors.json').versions).pop())")" > /dev/null
          echo "tool smoke test OK"

      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($script.Name)::$($errors[0].Message)"
            } else {
              Write-Host "PowerShell OK $($script.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Patcher fails clearly without a bundle
        shell: pwsh
        run: |
          $tmp = Join-Path ([IO.Path]::GetTempPath()) 'cline-mod-ci-empty'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $output = try {
            ./scripts/patch_cline_limits.ps1 -Report -ExtensionRoot $tmp 2>&1 | Out-String
          } catch {
            $_.Exception.Message
          }
          Write-Host $output
          if ($output -notmatch 'No dist') {
            Write-Host "::error::expected a clear failure for a folder without dist/extension.js"
            exit 1
          }
          Write-Host 'patcher failure path OK'
