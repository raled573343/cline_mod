name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -euo pipefail
          for f in anchors/*.json anchors/reports/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
            echo "JSON OK $f"
          done

      - name: Syntax-check the anchor tool
        run: node --check tools/cline-limits-tool.mjs

      - name: Tool usage smoke test
        run: |
          set -euo pipefail
          node tools/cline-limits-tool.mjs render-docs
          latest="$(node -e "console.log(Object.keys(require('./anchors/anchors.json').versions).pop())")"
          node tools/cline-limits-tool.mjs notes --version "$latest" > /dev/null
          mkdir -p .work-test
          node tools/cline-limits-tool.mjs standalone --version "$latest" --output .work-test/patch_cline_limits.ps1
          test -s .work-test/patch_cline_limits.ps1
          grep -q "\"$latest\"" .work-test/patch_cline_limits.ps1
          echo "tool smoke test OK"

      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          $scripts = @(Get-ChildItem scripts/*.ps1)
          if (Test-Path .work-test/patch_cline_limits.ps1) { $scripts += Get-Item .work-test/patch_cline_limits.ps1 }
          foreach ($script in $scripts) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($script.Name)::$($errors[0].Message)"
            } else {
              Write-Host "PowerShell OK $($script.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Patcher upgrades a trusted previous patch in place
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([IO.Path]::GetTempPath()) ('cline-mod-upgrade-' + [guid]::NewGuid().ToString('N'))
          $repoRoot = Join-Path $root 'repo'
          $extRoot = Join-Path $root 'extension'
          New-Item -ItemType Directory -Force -Path (Join-Path $repoRoot 'anchors'), (Join-Path $repoRoot 'scripts'), (Join-Path $extRoot 'dist') | Out-Null
          Copy-Item scripts/patch_cline_limits.ps1 (Join-Path $repoRoot 'scripts/patch_cline_limits.ps1')

          $clean = 'const a=1;const b=2;'
          $legacy = 'const a=10;const b=2;'
          $final = 'const a=10;const b=20;'
          function Get-TextSha([string]$Text) {
            $bytes = [Text.Encoding]::UTF8.GetBytes($Text)
            $sha = [Security.Cryptography.SHA256]::Create()
            try { return ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLower() }
            finally { $sha.Dispose() }
          }
          $catalog = @{
            schema = 'cline-mod-anchors-v1'
            versions = @{
              '9.9.9' = @{
                status = 'AUTO'
                bundleSha256Before = (Get-TextSha $clean)
                bundleSha256After = (Get-TextSha $final)
                acceptedSourceHashes = @((Get-TextSha $legacy))
                edits = @(
                  @{ old = 'a=1;'; new = 'a=10;' },
                  @{ old = 'b=2;'; new = 'b=20;' }
                )
              }
            }
          }
          $catalog | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $repoRoot 'anchors/anchors.json') -Encoding utf8
          node tools/cline-limits-tool.mjs standalone --version 9.9.9 --output (Join-Path $root 'patch.ps1') --repo-root $repoRoot
          '{"version":"9.9.9"}' | Set-Content -LiteralPath (Join-Path $extRoot 'package.json') -Encoding utf8
          [IO.File]::WriteAllText((Join-Path $extRoot 'dist/extension.js'), $legacy, (New-Object Text.UTF8Encoding($false)))

          $report = & (Join-Path $root 'patch.ps1') -Report -ExtensionRoot $extRoot *>&1 | Out-String
          Write-Host $report
          if ($report -notmatch 'UPGRADE_READY') { throw 'expected UPGRADE_READY for trusted legacy hash' }
          & (Join-Path $root 'patch.ps1') -Apply -ExtensionRoot $extRoot -BackupRoot (Join-Path $root 'backup')
          $actual = (Get-FileHash -LiteralPath (Join-Path $extRoot 'dist/extension.js') -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne (Get-TextSha $final)) { throw "upgrade final SHA mismatch: $actual" }
          Write-Host 'trusted in-place upgrade OK'

      - name: Optional safety profile stays opt-in and hash-gated
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([IO.Path]::GetTempPath()) ('cline-mod-profile-' + [guid]::NewGuid().ToString('N'))
          $repoRoot = Join-Path $root 'repo'
          $extRoot = Join-Path $root 'extension'
          New-Item -ItemType Directory -Force -Path (Join-Path $repoRoot 'anchors'), (Join-Path $repoRoot 'scripts'), (Join-Path $extRoot 'dist') | Out-Null
          Copy-Item scripts/patch_cline_limits.ps1 (Join-Path $repoRoot 'scripts/patch_cline_limits.ps1')

          $clean = 'const base=1;const guard=3;'
          $standard = 'const base=10;const guard=3;'
          $unlocked = 'const base=10;const guard=1000000;'
          function Get-TextSha([string]$Text) {
            $bytes = [Text.Encoding]::UTF8.GetBytes($Text)
            $sha = [Security.Cryptography.SHA256]::Create()
            try { return ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLower() }
            finally { $sha.Dispose() }
          }

          $catalog = @{
            schema = 'cline-mod-anchors-v1'
            versions = @{
              '9.9.8' = @{
                status = 'AUTO'
                bundleSha256Before = (Get-TextSha $clean)
                bundleSha256After = (Get-TextSha $standard)
                profiles = @{
                  standard = @{ groups=@('base'); bundleSha256After=(Get-TextSha $standard) }
                  'safety-unlock' = @{ groups=@('base','safety-unlock'); bundleSha256After=(Get-TextSha $unlocked) }
                }
                edits = @(
                  @{ old='base=1;'; new='base=10;'; group='base'; optional=$false },
                  @{ old='guard=3;'; new='guard=1000000;'; group='safety-unlock'; optional=$true }
                )
              }
            }
          }
          $catalog | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath (Join-Path $repoRoot 'anchors/anchors.json') -Encoding utf8
          node tools/cline-limits-tool.mjs standalone --version 9.9.8 --output (Join-Path $root 'patch.ps1') --repo-root $repoRoot
          '{"version":"9.9.8"}' | Set-Content -LiteralPath (Join-Path $extRoot 'package.json') -Encoding utf8
          [IO.File]::WriteAllText((Join-Path $extRoot 'dist/extension.js'), $clean, (New-Object Text.UTF8Encoding($false)))

          & (Join-Path $root 'patch.ps1') -Apply -ExtensionRoot $extRoot -BackupRoot (Join-Path $root 'backup-standard')
          $actualStandard = (Get-FileHash (Join-Path $extRoot 'dist/extension.js') -Algorithm SHA256).Hash.ToLower()
          if ($actualStandard -ne (Get-TextSha $standard)) { throw 'standard profile unexpectedly changed optional guard' }

          $report = & (Join-Path $root 'patch.ps1') -Report -SafetyUnlock -ExtensionRoot $extRoot *>&1 | Out-String
          Write-Host $report
          if ($report -notmatch 'UPGRADE_READY') { throw 'expected safety-unlock upgrade from standard profile' }

          & (Join-Path $root 'patch.ps1') -Apply -SafetyUnlock -ExtensionRoot $extRoot -BackupRoot (Join-Path $root 'backup-unlocked')
          $actualUnlocked = (Get-FileHash (Join-Path $extRoot 'dist/extension.js') -Algorithm SHA256).Hash.ToLower()
          if ($actualUnlocked -ne (Get-TextSha $unlocked)) { throw 'safety-unlock profile final SHA mismatch' }
          Write-Host 'optional safety profile OK'

      - name: Patcher fails clearly without a bundle
        shell: pwsh
        run: |
          $tmp = Join-Path ([IO.Path]::GetTempPath()) 'cline-mod-ci-empty'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $output = try {
            ./scripts/patch_cline_limits.ps1 -Report -ExtensionRoot $tmp 2>&1 | Out-String
          } catch {
            $_.Exception.Message
          }
          Write-Host $output
          if ($output -notmatch 'No dist') {
            Write-Host "::error::expected a clear failure for a folder without dist/extension.js"
            exit 1
          }
          Write-Host 'patcher failure path OK'
